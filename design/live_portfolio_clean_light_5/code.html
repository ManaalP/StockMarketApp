<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Live Portfolio - Error State</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
        },
        colors: {
          bg: '#FFFFFF',
          'surface-alt': '#F5F7FA',
          'text-strong': '#0F172A',
          text: '#334155',
          'text-muted': '#64748B',
          divider: '#E5E9F0',
          accent: '#2563EB',
          gain: '#16A34A',
          loss: '#DC2626',
          sell: '#EA580C',
          warning: '#B45309',
          'warning-bg': '#FEF6E7',
          'error-badge': '#DC2626',
        }
      }
    }
  }
</script>
<style>
  * {
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-color: #F1F5F9;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
</head>
<body class="flex justify-center p-0 sm:py-6 text-text">
<!-- Mobile Container (390 x 844) -->
<div class="w-[390px] h-[844px] bg-[#FFFFFF] flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[32px] border border-divider">
<!-- Status Bar (iOS style minimal) -->
<div class="h-11 px-6 flex justify-between items-center shrink-0 text-text-strong text-[14px] font-semibold tracking-tight select-none">
<span>9:41</span>
<div class="flex items-center space-x-2">
<!-- Signal -->
<svg class="w-4 h-3" fill="currentColor" viewbox="0 0 16 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="13.5" y="0"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-3.5" fill="currentColor" viewbox="0 0 16 14">
<path d="M8 12.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm-3.5-3.5a5 5 0 017 0 .75.75 0 001.06-1.06 6.5 6.5 0 00-9.12 0 .75.75 0 001.06 1.06zm-3-3a9.5 9.5 0 0113 0 .75.75 0 001.06-1.06 11 11 0 00-15.12 0 .75.75 0 001.06 1.06z"></path>
</svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-text-strong rounded-[2.5px] p-0.5 flex items-center">
<div class="h-full w-full bg-text-strong rounded-[1px]"></div>
</div>
</div>
</div>
<!-- Screen Header -->
<header class="px-4 pb-2.5 flex items-center justify-between shrink-0">
<h1 class="text-[20px] leading-[26px] font-semibold text-text-strong tracking-tight">Portfolio</h1>
<div class="flex items-center space-x-1.5">
<span class="inline-block w-2 h-2 rounded-full bg-slate-400"></span>
<span class="text-[12px] text-text-muted font-medium">Offline</span>
</div>
</header>
<!-- Scrollable Main Content -->
<main class="flex-1 overflow-y-auto px-4 pb-20 hide-scrollbar flex flex-col">
<!-- Summary Panel (Offline / Dash State showing holdings preserved) -->
<section class="bg-surface-alt rounded-[8px] p-3.5 mt-1 border border-divider">
<div class="flex flex-col">
<span class="text-[13px] leading-[18px] text-text-muted">Current value</span>
<span class="text-[30px] leading-[36px] font-semibold text-text-muted mt-0.5 tracking-tight">—</span>
</div>
<!-- 2x2 Grid of details -->
<div class="mt-3.5 pt-3 border-t border-divider grid grid-cols-2 gap-y-3 gap-x-2">
<!-- Total invested -->
<div>
<div class="text-[13px] leading-[18px] text-text-muted">Total invested</div>
<div class="text-[15px] leading-[20px] font-medium text-text mt-0.5">₹12,40,118.00</div>
</div>
<!-- Total P&L -->
<div>
<div class="text-[13px] leading-[18px] text-text-muted">Total P&amp;L</div>
<div class="text-[15px] leading-[20px] font-medium text-text-muted mt-0.5">—</div>
</div>
<!-- Today's P&L -->
<div>
<div class="text-[13px] leading-[18px] text-text-muted">Today's P&amp;L</div>
<div class="text-[15px] leading-[20px] font-medium text-text-muted mt-0.5">—</div>
</div>
<!-- Holdings -->
<div>
<div class="text-[13px] leading-[18px] text-text-muted">Holdings</div>
<div class="text-[15px] leading-[20px] font-medium text-text mt-0.5">22 holdings</div>
</div>
</div>
<!-- Bottom Warning Notice -->
<div class="mt-3 pt-2.5 border-t border-divider flex items-start space-x-1.5 text-text-muted">
<!-- Alert circle icon -->
<svg class="w-3.5 h-3.5 shrink-0 mt-[2px] stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<line x1="12" x2="12" y1="8" y2="12"></line>
<line x1="12" x2="12.01" y1="16" y2="16"></line>
</svg>
<p class="text-[11.5px] leading-[16px]">
            Real-time feed unavailable. Market valuations are currently paused.
          </p>
</div>
</section>
<!-- Error State Card (Price fetch failure) -->
<section class="flex-1 flex flex-col items-center justify-center py-10 px-4 text-center">
<!-- Icon: Minimal monochrome thin-line slate alert / cloud-off icon (1.5px stroke) -->
<div class="w-12 h-12 rounded-full bg-surface-alt border border-divider flex items-center justify-center text-text-muted mb-4 shadow-sm">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0-4 7h1.26A5 5 0 0 0 7 19h11a4.97 4.97 0 0 0 2.45-.65"></path>
<line x1="1" x2="23" y1="1" y2="23"></line>
</svg>
</div>
<!-- Title -->
<h2 class="text-[18px] leading-[24px] font-semibold text-text-strong tracking-tight">
          Couldn't load prices
        </h2>
<!-- Body text -->
<p class="text-[13px] leading-[18px] text-text-muted mt-1.5 max-w-xs">
          Check your connection and try again. Your holdings are safe.
        </p>
<!-- Action button -->
<button class="mt-6 w-[200px] h-[44px] bg-[#2563EB] hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-[14px] rounded-[8px] flex items-center justify-center space-x-2 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2" type="button">
<svg class="w-4 h-4 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<polyline points="23 4 23 10 17 10"></polyline>
<polyline points="1 20 1 14 7 14"></polyline>
<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
</svg>
<span>Retry</span>
</button>
</section>
</main>
<!-- Bottom Tab Bar -->
<nav class="absolute bottom-0 inset-x-0 h-16 bg-white border-t border-divider px-6 flex justify-around items-center shrink-0 z-20">
<!-- Portfolio Tab (Active) -->
<a class="flex flex-col items-center justify-center space-y-1 text-accent min-w-[64px] min-h-[44px]" href="#portfolio">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<rect height="14" rx="2" ry="2" width="20" x="2" y="7"></rect>
<path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
</svg>
<span class="text-[11px] font-medium leading-none">Portfolio</span>
</a>
<!-- Watchlist Tab (Inactive) -->
<a class="flex flex-col items-center justify-center space-y-1 text-text-muted hover:text-text min-w-[64px] min-h-[44px]" href="#watchlist">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
<span class="text-[11px] font-medium leading-none">Watchlist</span>
</a>
</nav>
</div>
</body></html>
